<!doctype html>
<html lang="en" data-brand="readyiq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your link — ReadyIQ for loan officers</title>
<link rel="stylesheet" href="../assets/fonts/geist.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  .mk-nav { position: sticky; top: 0; z-index: 30; background: rgba(13,32,36,.9); backdrop-filter: blur(14px); color: #fff; }
  .mk-nav-inner { height: 64px; display: flex; align-items: center; gap: 16px; }
  .rmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.02em; font-size: 18px; color: inherit; text-decoration: none !important; }
  .rmark i { width: 30px; height: 30px; border-radius: 9px; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-style: normal; font-weight: 800; }
  .rmark span span { color: var(--lime); }
  .lo-tabs { display: flex; gap: 4px; margin-left: 12px; }
  .lo-tabs a { color: rgba(255,255,255,.72); font-weight: 580; padding: 8px 12px; border-radius: var(--r-pill); }
  .lo-tabs a:hover { text-decoration: none; color: #fff; background: rgba(255,255,255,.08); }
  .lo-tabs a.active { background: var(--lime); color: var(--lime-ink); }
  .lo-user { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: var(--fs-13); color: rgba(255,255,255,.75); }
  .lo-user .avatar { background: rgba(255,255,255,.14); color: #fff; }
  .lo-wrap { max-width: 1040px; margin: 0 auto; padding: var(--sp-8) var(--sp-4) var(--sp-16); display: grid; gap: var(--sp-6); }
  .link-hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: var(--sp-6); align-items: stretch; }
  .link-box { display: grid; gap: 14px; }
  .link-url { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-2); background: var(--paper-2); border: 1px solid var(--line-2); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: var(--fs-15); overflow: hidden; }
  .link-url code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qr { display: grid; place-items: center; gap: 8px; text-align: center; }
  .qr img { width: 180px; height: 180px; border-radius: 12px; border: 1px solid var(--line-2); background: #fff; padding: 8px; }
  .msg-preview { display: grid; gap: 8px; }
  .bubble { max-width: 92%; padding: 12px 14px; border-radius: 18px 18px 18px 6px; background: var(--paper); font-size: var(--fs-13); line-height: 1.45; }
  .link-card { border-radius: 14px; border: 1px solid var(--line-2); overflow: hidden; background: #fff; }
  .link-card .lc-img { height: 88px; background: linear-gradient(135deg, var(--navy), #1B4C46); display: grid; place-items: center; color: #fff; font-weight: 700; }
  .link-card .lc-body { padding: 10px 12px; font-size: 12px; }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .counts .card { padding: 14px 16px; }
  .counts b { font-size: var(--fs-32); letter-spacing: -.03em; display: block; line-height: 1; }
  .feed-list { display: grid; }
  .feed-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line-2); }
  .feed-row:first-child { border-top: 0; }
  .feed-row .name { font-weight: 620; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .feed-row .meta { font-size: var(--fs-13); color: var(--ink-3); }
  .feed-row .spark { width: 120px; }
  .feed-row .acts { display: flex; gap: 6px; }
  .feed-row.pinned { background: var(--mint); }
  .org-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); align-items: start; }
  .prod-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 10px 0; }
  .prod-row + .prod-row { border-top: 1px solid var(--line-2); }
  .prod-row .step-num { width: 34px; height: 34px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-pill); overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 6px 10px; font-size: var(--fs-12); font-weight: 620; color: var(--ink-3); }
  .seg button.on { background: var(--navy); color: #fff; }
  @media (max-width: 900px) { .link-hero, .org-grid { grid-template-columns: 1fr; } .counts { grid-template-columns: 1fr; } .lo-tabs { display: none; } }
</style>
</head>
<body>
<nav class="mk-nav"><div class="container mk-nav-inner">
  <a class="rmark" href="../index.html"><i>R</i><span>Ready<span>IQ</span></span></a>
  <div class="lo-tabs" id="lo-tabs"></div>
  <div class="lo-user" id="lo-user"></div>
</div></nav>
<main class="lo-wrap" id="view"></main>
<nav class="bottomnav" id="lo-bottom" style="grid-template-columns:repeat(3,1fr)"></nav>
<script type="module" src="../assets/js/page-lo.js"></script>
</body>
</html>
