<!doctype html>
<html lang="en" data-brand="readyiq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get your link — ReadyIQ for loan officers</title>
<link rel="stylesheet" href="../../assets/fonts/geist.css">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
  .mk-nav { position: sticky; top: 0; z-index: 30; background: rgba(13,32,36,.9); backdrop-filter: blur(14px); color: #fff; }
  .mk-nav-inner { height: 64px; display: flex; align-items: center; gap: 16px; }
  .rmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.02em; font-size: 18px; color: inherit; text-decoration: none !important; }
  .rmark i { width: 30px; height: 30px; border-radius: 9px; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-style: normal; font-weight: 800; }
  .rmark span span { color: var(--lime); }
  .wrap { max-width: 560px; margin: 0 auto; padding: var(--sp-10) var(--sp-4) var(--sp-16); display: grid; gap: var(--sp-6); }
  .step { display: grid; gap: var(--sp-4); animation: settle var(--dur-2) var(--ease) both; }
  .lo-found { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
  .brand-found { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
  .swatch { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line-2); }
  .timer { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<nav class="mk-nav"><div class="container mk-nav-inner"><a class="rmark" href="../../index.html"><i>R</i><span>Ready<span>IQ</span></span></a><span class="muted small" style="color:rgba(255,255,255,.6)">for loan officers</span><a class="btn btn-ghost btn-sm" href="../" style="margin-left:auto;color:#fff">Already have a link? Sign in</a></div></nav>
<main class="wrap">
  <div id="path-hero"></div>
  <div id="step"></div>
</main>
<script type="module" src="../../assets/js/page-lo-start.js"></script>
</body>
</html>
