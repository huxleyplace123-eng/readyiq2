<!doctype html>
<html lang="en" data-brand="readyiq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partner link — ReadyIQ</title>
<link rel="stylesheet" href="../assets/fonts/geist.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  .mk-nav { position: sticky; top: 0; z-index: 30; background: rgba(13,32,36,.9); backdrop-filter: blur(14px); color: #fff; }
  .mk-nav-inner { height: 64px; display: flex; align-items: center; gap: 16px; }
  .rmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.02em; font-size: 18px; color: inherit; text-decoration: none !important; }
  .rmark i { width: 30px; height: 30px; border-radius: 9px; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-style: normal; font-weight: 800; }
  .rmark span span { color: var(--lime); }
  .wrap { max-width: 900px; margin: 0 auto; padding: var(--sp-8) var(--sp-4) var(--sp-16); display: grid; gap: var(--sp-6); }
  .two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: var(--sp-4); }
  .qr img { width: 160px; height: 160px; border-radius: 12px; border: 1px solid var(--line-2); background: #fff; padding: 8px; margin: 0 auto; }
  .prow { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line-2); align-items: center; }
  .prow:first-child { border-top: 0; }
  @media (max-width: 800px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="mk-nav"><div class="container mk-nav-inner"><a class="rmark" href="../index.html"><i>R</i><span>Ready<span>IQ</span></span></a><span class="small" style="color:rgba(255,255,255,.6)">for partners</span></div></nav>
<main class="wrap" id="view"></main>
<script type="module">

  document.title = `${partner.first} ${partner.last} — partner link — ReadyIQ`;

</script>
</body>
</html>
