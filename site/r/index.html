<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyIQ link</title>
<link rel="stylesheet" href="../assets/fonts/geist.css"><link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/base.css">
<style>body{display:grid;place-items:center;min-height:100vh}.box{display:grid;gap:8px;text-align:center;color:var(--ink-3)}</style></head>
<body><div class="box"><b style="color:var(--ink)">Opening your invitation…</b><span class="small">One link per human. Attribution stays with the person who sent it.</span></div>
<script type="module">
  import { loadState, saveState, resolveLink, parseQuery } from '../assets/js/state.js';
  const state = loadState(); const q = parseQuery(location.search);
  const attr = q.c ? resolveLink(state, q.c) : null;
  if (attr) { state.session.attribution = attr; saveState(state); }
  location.replace('../check/' + (attr ? '?c=' + encodeURIComponent(q.c) : ''));
</script></body></html>
