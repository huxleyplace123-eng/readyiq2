<!doctype html>
<html lang="en" data-brand="harbor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your readiness check — Harbor Home Loans</title>
<link rel="stylesheet" href="../assets/fonts/geist.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  .enroll { max-width: 560px; margin: 0 auto; padding: var(--sp-6) var(--sp-4) var(--sp-16); display: grid; gap: var(--sp-6); }
  .step { display: grid; gap: var(--sp-5); animation: settle var(--dur-2) var(--ease) both; }
  .step-head { display: grid; gap: 6px; }
  .actions { display: grid; gap: 10px; }
  .kba { display: grid; gap: 8px; }
  .kba .radio-row { display: grid; gap: 6px; }
  .reveal { text-align: center; display: grid; gap: var(--sp-5); justify-items: center; padding-top: var(--sp-6); }
  .reveal .number-value { font-size: 88px; }
  .reveal .badge { height: 30px; font-size: 13px; }
  .lo-card .avatar-lg { background: var(--brand); color: #fff; }
  .lo-meta { font-size: var(--fs-13); color: var(--ink-3); }
</style>
</head>
<body>
<header class="topbar"><div class="container topbar-inner">
  <span class="brand-mark" data-lender-mark>H</span><span class="brand-name" data-lender-name>Harbor Home Loans</span>
  <span class="powered">Powered by <b>ReadyIQ</b> · IDIQ</span>
</div></header>
<main class="enroll">
  <div id="path-hero"></div>
  <div id="step"></div>
</main>
<script type="module" src="../assets/js/page-enroll.js"></script>
</body>
</html>
